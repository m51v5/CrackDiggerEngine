name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Check the tag matches the version
        run: |
          version=$(dotnet msbuild src/CrackDiggerEngine/CrackDiggerEngine.csproj -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in CrackDiggerEngine.csproj"
            exit 1
          fi
      - name: Pack
        run: dotnet pack src/CrackDiggerEngine/CrackDiggerEngine.csproj -c Release -o artifacts
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --title "CrackDiggerEngine $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      # Trusted publishing: a short-lived key for this run, no stored secret
      - name: NuGet login
        id: nuget
        uses: NuGet/login@v1
        with:
          user: m51v5
      - name: Push to nuget.org
        run: dotnet nuget push artifacts/*.nupkg --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
